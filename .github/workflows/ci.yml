name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit & e2e smoke
        run: pytest -q
      - name: Golden eval smoke
        run: python scripts/run_eval.py

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::Missing GitHub secret RAILWAY_TOKEN (Railway Project Token)."
            exit 1
          fi
          if [ -z "${RAILWAY_SERVICE_ID:-}" ]; then
            echo "::error::Missing GitHub secret RAILWAY_SERVICE_ID."
            echo "Your Railway project has multiple services (e.g. API + Redis)."
            echo "Add secret RAILWAY_SERVICE_ID = the API/web service name or ID."
            echo "Find it: Railway → API service → Settings → copy Service ID (or use the service name)."
            echo "Listing project services (if token allows):"
            railway status --json || true
            exit 1
          fi
          echo "Deploying to service: $RAILWAY_SERVICE_ID"
          railway up --ci --detach --service "$RAILWAY_SERVICE_ID"
