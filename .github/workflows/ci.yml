name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit & e2e smoke
        run: pytest -q
      - name: Golden eval smoke
        run: python scripts/run_eval.py

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploy from repo root so Railway Root Directory=backend resolves correctly.
    # (Uploading only backend/ makes Railway look for backend/backend and fail.)
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::Missing GitHub secret RAILWAY_TOKEN (Railway Project Token)."
            exit 1
          fi

          SERVICE="${RAILWAY_SERVICE_ID:-}"
          if [ -z "$SERVICE" ]; then
            echo "RAILWAY_SERVICE_ID not set — listing services and auto-detecting API..."
            RAW="$(railway service list --json 2>/dev/null || true)"
            if [ -z "$RAW" ]; then
              RAW="$(railway status --json 2>/dev/null || true)"
            fi
            echo "$RAW"
            SERVICE="$(printf '%s' "$RAW" | python3 -c '
          import json, re, sys
          raw = sys.stdin.read().strip()
          if not raw:
              raise SystemExit(0)
          data = json.loads(raw)
          services = []
          if isinstance(data, list):
              services = data
          elif isinstance(data, dict):
              for key in ("services", "Services"):
                  if isinstance(data.get(key), list):
                      services = data[key]
                      break
              if not services:
                  def walk(obj, out):
                      if isinstance(obj, dict):
                          if "name" in obj and ("id" in obj or "serviceId" in obj):
                              out.append(obj)
                          for v in obj.values():
                              walk(v, out)
                      elif isinstance(obj, list):
                          for i in obj:
                              walk(i, out)
                  walk(data, services)
          skip = re.compile(r"^(redis|postgres|postgresql|mongo|mongodb|mysql|database)$", re.I)
          names = []
          for s in services:
              name = str(s.get("name") or s.get("serviceName") or "")
              if not name or skip.match(name):
                  continue
              if name not in names:
                  names.append(name)
          if len(names) == 1:
              print(names[0])
          elif len(names) > 1:
              print("MULTIPLE:" + ",".join(names), file=sys.stderr)
          ')"
            if [ -z "$SERVICE" ]; then
              echo "::error::Could not auto-detect a single API service."
              echo "Add GitHub secret RAILWAY_SERVICE_ID using the service NAME from the Railway canvas."
              exit 1
            fi
          fi

          echo "Deploying to service: $SERVICE (from repo root; Railway Root Directory should be backend)"
          test -f backend/Dockerfile
          test -f backend/railway.toml
          railway up --ci --detach --service "$SERVICE"
