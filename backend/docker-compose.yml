services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hrmind
      POSTGRES_PASSWORD: hrmind
      POSTGRES_DB: hrmind
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrmind -d hrmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Browser DB UI: http://localhost:8080
  # System: PostgreSQL | Server: postgres | User/Pass/DB: hrmind
  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  # Browser Redis UI: http://localhost:8081
  # Host: redis | Port: 6379 (no password)
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  pgdata:
