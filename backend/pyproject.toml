[project]
name = "hrmind"
version = "0.1.0"
description = "Enterprise HR AI Agent backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "redis>=5.2.0",
  "httpx>=0.28.0",
  "openai>=1.57.0",
  "langgraph>=0.2.60",
  "langchain-core>=0.3.0",
  "sqlglot>=25.0.0",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
  "pgvector>=0.3.6",
  "arq>=0.26.1",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "structlog>=24.4.0",
  "python-multipart>=0.0.17",
  "tenacity>=9.0.0",
  "numpy>=2.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "faker>=33.0.0",
  "reportlab>=4.2.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
